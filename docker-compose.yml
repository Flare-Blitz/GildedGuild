services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Database Backend/test_SQL_Database.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
  
  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"

volumes:
  mysql_data:
  frontend_node_modules:
  frontend_next:
