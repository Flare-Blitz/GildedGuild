name: Secret scanning

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@080c22fb8ea3107163b9dbcc33396a41c518b990
        with:
          version: 3.97.4
          path: ./
          extra_args: --results=verified,unknown --fail
