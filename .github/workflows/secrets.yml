name: Secret scanning

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@v3.97.4
        with:
          version: v3.97.4
          path: ./
          extra_args: --results=verified,unknown --fail
